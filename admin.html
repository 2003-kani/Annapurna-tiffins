<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annapurna Tiffins | Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background-color: #f8fafc; }
    .admin-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .orders-table {
      width: 100%;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border-collapse: collapse;
    }
    .orders-table th, .orders-table td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    .orders-table th {
      background-color: #f1f5f9;
      font-weight: 600;
      color: #334155;
    }
    .orders-table tr:hover {
      background-color: #f8fafc;
    }
    .status-select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-family: inherit;
      background-color: white;
      cursor: pointer;
      font-weight: 500;
    }
    .status-pending { background-color: #fef3c7; color: #92400e; border-color: #fcd34d; }
    .status-preparing { background-color: #e0f2fe; color: #075985; border-color: #7dd3fc; }
    .status-out_for_delivery { background-color: #f3e8ff; color: #6b21a8; border-color: #d8b4fe; }
    .status-delivered { background-color: #dcfce3; color: #166534; border-color: #86efac; }
    .status-cancelled { background-color: #fee2e2; color: #991b1b; border-color: #fca5a5; }
    
    .item-list {
      margin: 0;
      padding-left: 16px;
      font-size: 0.9em;
    }
    .refresh-btn {
      padding: 10px 20px;
      background: #ea580c; /* Theme orange */
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .refresh-btn:hover { background: #c2410c; }
    #errorMessage { color: red; margin-bottom: 20px; }
  </style>
</head>
<body>

  <nav class="top-nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-text">Annapurna Tiffins Admin</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Back to Website</a>
      </div>
    </div>
  </nav>

  <div class="admin-container">
    <div class="admin-header">
      <div>
        <h2>Order Management Dashboard</h2>
        <p>View and manage recent orders</p>
      </div>
      <button class="refresh-btn" id="refreshBtn">↻ Refresh Orders</button>
    </div>

    <div id="errorMessage"></div>

    <table class="orders-table">
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Items Ordered</th>
          <th>Total (Rs)</th>
          <th>Time</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="ordersBody">
        <tr><td colspan="6" style="text-align: center;">Loading orders...</td></tr>
      </tbody>
    </table>
  </div>

  <script src="admin.js"></script>
</body>
</html>
